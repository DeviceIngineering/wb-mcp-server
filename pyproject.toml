[project]
name = "wb-mcp-server"
version = "2.2.0"
description = "MCP-сервер для Wildberries Seller API (товары, цены, заказы, финансы, реклама, аналитика, акции, FBW, диагностика, отзывы-пины, Джем-аналитика, замеры, эквайринг)"
requires-python = ">=3.10"
dependencies = [
    # ВНИМАНИЕ: верхняя граница обязательна.
    # В mcp 2.0.0 low-level API переписан: у mcp.server.Server больше нет
    # декораторов @app.list_tools() / @app.call_tool() — обработчики передаются
    # в конструктор (on_list_tools / on_call_tool) и возвращают ListToolsResult /
    # CallToolResult вместо list[Tool] / list[TextContent]. С mcp>=2 сервер падает
    # ещё на импорте: AttributeError: 'Server' object has no attribute 'list_tools'.
    # Снимать ограничение можно только вместе с переписыванием wb_mcp/server.py
    # (см. TODO там же).
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wb_mcp"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
wb-mcp = "wb_mcp.server:main"
wb-mcp-web = "wb_mcp.app:main"
